    .font-fredoka { font-family: 'Fredoka', cursive; }

    .card-inner { transition: transform 0.6s; transform-style: preserve-3d; }
    .card-flipped .card-inner { transform: rotateY(180deg); }
    .card-front, .card-back { backface-visibility: hidden; }
    .card-back { transform: rotateY(180deg); }
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    .animate-float { animation: float 3s ease-in-out infinite; }
  </style>
</head>

      <h2 class="text-2xl font-bold font-fredoka text-sky-600 mb-1">Welcome Pupil! 👋</h2>
      <p class="text-slate-600 text-sm mb-4">I'm <strong>Teacher Wafi</strong>. Enter your name and class to start Get Smart Plus 3 (Unit 9: On Holiday) revision!</p>

      <form id="regForm" onsubmit="submitRegistration(event)" class="space-y-4">
        <div>
          <label class="block text-left text-xs font-bold text-slate-600 mb-1 uppercase tracking-wider">Pupil Name</label>
          <input type="text" id="pupilNameInput" required placeholder="e.g. Adam / Nur Aisyah" class="w-full px-4 py-3 rounded-xl border-2 border-sky-200 focus:border-sky-500 focus:outline-none font-semibold text-slate-700 bg-sky-50/50">
        </div>

        <div>
          <label class="block text-left text-xs font-bold text-slate-600 mb-1 uppercase tracking-wider">Class</label>
          <input type="text" id="pupilClassInput" required placeholder="e.g. 3 Princeton / 3 Malaya" class="w-full px-4 py-3 rounded-xl border-2 border-sky-200 focus:border-sky-500 focus:outline-none font-semibold text-slate-700 bg-sky-50/50">
        </div>

        <button type="submit" class="w-full py-3.5 bg-sky-500 hover:bg-sky-600 active:scale-95 text-white font-bold font-fredoka rounded-xl shadow-lg shadow-sky-300/50 transition duration-200 text-lg">
          Start Learning Now 🚀
        </button>
      </form>
    </div>
  </div>

        <div>
          <h1 class="font-fredoka text-lg md:text-xl font-bold text-sky-700 leading-tight">On Holiday 🏖️</h1>
          <p class="text-xs text-slate-500 font-semibold">Get Smart Plus 3 • Teacher Wafi</p>
        </div>
      </div>

      <div id="pupilBadge" class="hidden flex items-center space-x-2 bg-sky-50 border border-sky-200 px-3 py-1.5 rounded-full">
        <span class="text-xs font-bold text-sky-800" id="badgeName">Pupil Name</span>
        <span class="text-[10px] bg-sky-200 text-sky-800 px-2 py-0.5 rounded-full font-bold" id="badgeClass">Class</span>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT CONTAINER -->
  <main class="max-w-5xl mx-auto px-4 pt-6 flex-grow w-full">

          🎴 Verbs
